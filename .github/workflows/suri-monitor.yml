name: Vigilar progreso de SURI

on:
  push:
    paths:
      - "monitor_suri.py"
      - ".github/workflows/suri-monitor.yml"
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suri-progress-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Comprobar el porcentaje y avisar si sube
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor_suri.py

      - name: Guardar el último porcentaje revisado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar referencia de progreso SURI"
            git push
          fi
