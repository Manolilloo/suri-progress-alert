name: Probar notificación móvil
# Último simulacro visual solicitado desde el chat.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Descargar el monitor
        uses: actions/checkout@v7

      - name: Enviar simulacro con datos reales de PortWatch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import os
          from monitor_suri import (
              fetch_tracker,
              find_leader,
              round_one_decimal,
              score_effort,
              send_notification,
          )

          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              raise SystemExit("Falta el secreto NTFY_TOPIC.")

          data = fetch_tracker()
          leader = find_leader(data)
          fps = round_one_decimal(float((leader.get("gta") or {}).get("fps") or 0))
          leader_name = str(leader.get("name") or leader.get("id") or "—")
          score = score_effort(leader)
          print(f"Simulacro visual GLOBAL: {score:.1f}% | {fps:g} FPS | líder: {leader_name}")
          send_notification(topic, score, fps, leader_name)
          print("ntfy aceptó el simulacro del líder global.")
          PY
