name: Probar notificación móvil

on:
  push:
    paths:
      - ".github/workflows/notify-test.yml"
      - "monitor_suri.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Descargar el monitor
        uses: actions/checkout@v7

      - name: Enviar simulacro con datos reales de PortWatch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import os
          from monitor_suri import (
              fetch_tracker,
              find_leader,
              find_suri,
              round_one_decimal,
              score_effort,
              send_notification,
          )

          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              raise SystemExit("Falta el secreto NTFY_TOPIC.")

          data = fetch_tracker()
          suri = find_suri(data)
          leader = find_leader(data)
          fps = round_one_decimal(float((suri.get("gta") or {}).get("fps") or 0))
          leader_name = str((leader or {}).get("name") or (leader or {}).get("id") or "—")
          score = score_effort(suri)

          print(f"Simulacro visual: {score:.1f}% | {fps:g} FPS | líder: {leader_name}")
          send_notification(topic, score, fps, leader_name, test=True)
          print("ntfy aceptó el simulacro de una línea.")
          PY
